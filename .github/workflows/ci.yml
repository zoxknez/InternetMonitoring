# Builds and tests every push and pull request.
#
# Windows, because the application is Windows-only: the service, the named-pipe security and
# the Native Wi-Fi layer have no counterpart elsewhere. The test suite itself needs neither a
# network nor a radio - that is the point of keeping the fault catalogue in IEM.Core - so it
# runs unchanged on a hosted runner.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Postavi .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Locked mode, so a dependency that moved under us fails here rather than in somebody's
      # evidence package. The report claims the build is reproducible; this is that claim.
      - name: Zakljucane zavisnosti
        run: dotnet restore InternetEvidenceMonitor.slnx -p:VerifyLockedDependencies=true --nologo

      - name: Gradnja
        run: dotnet build InternetEvidenceMonitor.slnx -c Release --no-restore --nologo

      # A fixture on the machine that wrote it is not a fixture in the repository. 2.7.1
      # shipped with baseline/ excluded by an ignore rule meant for real sessions: every test
      # passed locally and the same tests failed here, on files that were simply not there.
      # Checked before the tests, so the failure names the cause instead of the symptom.
      - name: Baseline artefakti su u repozitorijumu
        shell: pwsh
        run: |
          $tracked = git ls-files baseline | ForEach-Object { (Resolve-Path $_).Path }
          $onDisk = Get-ChildItem baseline -Recurse -File | Select-Object -ExpandProperty FullName
          $missing = $onDisk | Where-Object { $tracked -notcontains $_ }

          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::Nije u gitu: $_" }
            exit 1
          }

          Write-Host "Svi baseline artefakti su praceni: $($tracked.Count)"

      - name: Testovi
        run: dotnet test InternetEvidenceMonitor.slnx -c Release --no-build --nologo
