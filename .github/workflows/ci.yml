# Builds and tests the Windows and Linux products on explicitly versioned runners.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build and tests
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Postavi .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Locked mode, so a dependency that moved under us fails here rather than in somebody's
      # evidence package. The report claims the build is reproducible; this is that claim.
      - name: Zakljucane zavisnosti
        run: dotnet restore InternetEvidenceMonitor.slnx -p:VerifyLockedDependencies=true --nologo

      - name: Gradnja
        run: dotnet build InternetEvidenceMonitor.slnx -c Release --no-restore --nologo

      # A fixture on the machine that wrote it is not a fixture in the repository. 2.7.1
      # shipped with baseline/ excluded by an ignore rule meant for real sessions: every test
      # passed locally and the same tests failed here, on files that were simply not there.
      # Checked before the tests, so the failure names the cause instead of the symptom.
      - name: Baseline artefakti su u repozitorijumu
        shell: pwsh
        run: |
          $tracked = git ls-files baseline | ForEach-Object { (Resolve-Path $_).Path }
          $onDisk = Get-ChildItem baseline -Recurse -File | Select-Object -ExpandProperty FullName
          $missing = $onDisk | Where-Object { $tracked -notcontains $_ }

          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::Nije u gitu: $_" }
            exit 1
          }

          Write-Host "Svi baseline artefakti su praceni: $($tracked.Count)"

      - name: Testovi
        run: dotnet test InternetEvidenceMonitor.slnx -c Release --no-build --nologo

  linux-build:
    name: Linux build, tests and package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Postavi .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Zakljucane Linux zavisnosti
        run: |
          dotnet restore src/IEM.App.Linux/IEM.App.Linux.csproj -p:VerifyLockedDependencies=true --nologo
          dotnet restore src/IEM.Service.Linux/IEM.Service.Linux.csproj -p:VerifyLockedDependencies=true --nologo
          dotnet restore tests/IEM.Core.Tests/IEM.Core.Tests.csproj -p:VerifyLockedDependencies=true --nologo
          dotnet restore tests/IEM.App.Linux.Tests/IEM.App.Linux.Tests.csproj -p:VerifyLockedDependencies=true --nologo

      - name: Linux gradnja
        run: |
          dotnet build src/IEM.App.Linux/IEM.App.Linux.csproj -c Release --no-restore --nologo
          dotnet build src/IEM.Service.Linux/IEM.Service.Linux.csproj -c Release --no-restore --nologo
          dotnet build tests/IEM.App.Linux.Tests/IEM.App.Linux.Tests.csproj -c Release --no-restore --nologo

      - name: Deljeni i Linux testovi
        run: |
          dotnet test tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-restore --nologo
          dotnet test tests/IEM.App.Linux.Tests/IEM.App.Linux.Tests.csproj -c Release --no-restore --nologo

      - name: Napravi i proveri linux-x64 paket
        run: |
          chmod +x scripts/publish-linux.sh
          chmod +x scripts/ci/verify-linux-package.sh
          bash scripts/publish-linux.sh linux-x64
          bash scripts/ci/verify-linux-package.sh artifacts/linux/linux-x64/internet-evidence-monitor_3.1.0~alpha1_amd64.deb

      - name: Sacuvaj Linux artefakte
        uses: actions/upload-artifact@v4
        with:
          name: internet-evidence-monitor-3.1.0-alpha.1-linux-x64
          path: artifacts/linux/linux-x64/
          if-no-files-found: error
          retention-days: 14
