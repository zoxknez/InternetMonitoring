name: cross-platform-crypto-storage-acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-crypto-storage:
    name: Windows Crypto & Canonical Storage Acceptance (XPL-01..30)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore InternetEvidenceMonitor.slnx --nologo

      - name: Build solution
        run: dotnet build InternetEvidenceMonitor.slnx -c Release --no-restore --nologo

      - name: Run Shared Cross-Platform Acceptance Tests (16 gates)
        run: dotnet test tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Shared" --logger "console;verbosity=normal"

      - name: Run Windows-Native Acceptance Tests (9 gates)
        run: dotnet test tests/IEM.App.Tests/IEM.App.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Windows" --logger "console;verbosity=normal"

  linux-crypto-storage:
    name: Linux Crypto & Canonical Storage Acceptance (XPL-01..30)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/IEM.Core.Tests/IEM.Core.Tests.csproj --nologo

      - name: Build IEM.Core.Tests
        run: dotnet build tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-restore --nologo

      - name: Run Shared Cross-Platform Acceptance Tests (16 gates)
        run: dotnet test tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Shared" --logger "console;verbosity=normal"

      - name: Run Linux-Native Acceptance Tests (13 gates)
        run: dotnet test tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Linux" --logger "console;verbosity=normal"
