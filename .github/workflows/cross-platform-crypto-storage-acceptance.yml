name: cross-platform-crypto-storage-acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-crypto-storage:
    name: Windows Crypto & Canonical Storage Acceptance (XPL-01..30)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore InternetEvidenceMonitor.slnx --nologo

      - name: Build solution
        run: dotnet build InternetEvidenceMonitor.slnx -c Release --no-restore --nologo

      - name: Run Shared Cross-Platform Acceptance Tests (16 gates)
        shell: pwsh
        run: |
          dotnet test tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Shared" --logger "console;verbosity=normal" --logger "trx;LogFileName=shared_results.trx"
          $trxPath = Join-Path "tests/IEM.Core.Tests/TestResults" "shared_results.trx"
          if (-not (Test-Path $trxPath)) { throw "TRX results file not found at $trxPath" }
          $trx = [xml](Get-Content $trxPath)
          $total = [int]$trx.TestRun.ResultSummary.Counters.total
          $passed = [int]$trx.TestRun.ResultSummary.Counters.passed
          $failed = [int]$trx.TestRun.ResultSummary.Counters.failed
          $skipped = if ($trx.TestRun.ResultSummary.Counters.notExecuted) { [int]$trx.TestRun.ResultSummary.Counters.notExecuted } else { 0 }
          Write-Host "Windows Runner -> Shared Acceptance Gates: Total=$total, Passed=$passed, Failed=$failed, Skipped=$skipped"
          if ($total -ne 16 -or $passed -ne 16 -or $failed -ne 0 -or $skipped -ne 0) {
            throw "Gate count assertion failed: Expected exactly Total=16, Passed=16, Failed=0, Skipped=0 Shared gates, got Total=$total, Passed=$passed, Failed=$failed, Skipped=$skipped."
          }

      - name: Run Windows-Native Acceptance Tests (9 gates)
        shell: pwsh
        run: |
          dotnet test tests/IEM.App.Tests/IEM.App.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Windows" --logger "console;verbosity=normal" --logger "trx;LogFileName=windows_results.trx"
          $trxPath = Join-Path "tests/IEM.App.Tests/TestResults" "windows_results.trx"
          if (-not (Test-Path $trxPath)) { throw "TRX results file not found at $trxPath" }
          $trx = [xml](Get-Content $trxPath)
          $total = [int]$trx.TestRun.ResultSummary.Counters.total
          $passed = [int]$trx.TestRun.ResultSummary.Counters.passed
          $failed = [int]$trx.TestRun.ResultSummary.Counters.failed
          $skipped = if ($trx.TestRun.ResultSummary.Counters.notExecuted) { [int]$trx.TestRun.ResultSummary.Counters.notExecuted } else { 0 }
          Write-Host "Windows Runner -> Windows-Native Acceptance Gates: Total=$total, Passed=$passed, Failed=$failed, Skipped=$skipped"
          if ($total -ne 9 -or $passed -ne 9 -or $failed -ne 0 -or $skipped -ne 0) {
            throw "Gate count assertion failed: Expected exactly Total=9, Passed=9, Failed=0, Skipped=0 Windows-native gates, got Total=$total, Passed=$passed, Failed=$failed, Skipped=$skipped."
          }

  linux-crypto-storage:
    name: Linux Crypto & Canonical Storage Acceptance (XPL-01..30)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore tests/IEM.Core.Tests/IEM.Core.Tests.csproj --nologo

      - name: Build IEM.Core.Tests
        run: dotnet build tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-restore --nologo

      - name: Run Shared Cross-Platform Acceptance Tests (16 gates)
        run: |
          dotnet test tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Shared" --logger "console;verbosity=normal" --logger "trx;LogFileName=shared_results.trx"
          TRX_FILE="tests/IEM.Core.Tests/TestResults/shared_results.trx"
          if [ ! -f "$TRX_FILE" ]; then echo "TRX results file missing"; exit 1; fi
          TOTAL=$(grep -o 'total="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          PASSED=$(grep -o 'passed="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          FAILED=$(grep -o 'failed="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          SKIPPED=$(grep -o 'notExecuted="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          if [ -z "$SKIPPED" ]; then SKIPPED=0; fi
          echo "Linux Runner -> Shared Acceptance Gates: Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED"
          if [ "$TOTAL" != "16" ] || [ "$PASSED" != "16" ] || [ "$FAILED" != "0" ] || [ "$SKIPPED" != "0" ]; then
            echo "Gate count assertion failed: Expected Total=16, Passed=16, Failed=0, Skipped=0, got Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED."
            exit 1
          fi

      - name: Run Linux-Native Acceptance Tests (13 gates)
        run: |
          dotnet test tests/IEM.Core.Tests/IEM.Core.Tests.csproj -c Release --no-build --nologo --filter "Acceptance=3.1-8F & Platform=Linux" --logger "console;verbosity=normal" --logger "trx;LogFileName=linux_results.trx"
          TRX_FILE="tests/IEM.Core.Tests/TestResults/linux_results.trx"
          if [ ! -f "$TRX_FILE" ]; then echo "TRX results file missing"; exit 1; fi
          TOTAL=$(grep -o 'total="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          PASSED=$(grep -o 'passed="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          FAILED=$(grep -o 'failed="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          SKIPPED=$(grep -o 'notExecuted="[0-9]*"' "$TRX_FILE" | head -1 | grep -o '[0-9]*')
          if [ -z "$SKIPPED" ]; then SKIPPED=0; fi
          echo "Linux Runner -> Linux-Native Acceptance Gates: Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED"
          if [ "$TOTAL" != "13" ] || [ "$PASSED" != "13" ] || [ "$FAILED" != "0" ] || [ "$SKIPPED" != "0" ]; then
            echo "Gate count assertion failed: Expected Total=13, Passed=13, Failed=0, Skipped=0, got Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED."
            exit 1
          fi
